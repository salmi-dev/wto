name: Auto Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  patch:
    name: Bump patch and release
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.display_title, 'chore(release):')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(git rev-parse HEAD)
          if [ "$current_sha" != "$CI_HEAD_SHA" ]; then
            echo "main moved from $CI_HEAD_SHA to $current_sha; skipping release."
            echo "released=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(sed -n 's/^VERSION=//p' wto)
          test -n "$version"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          patch=${version##*.}
          next="$major.$minor.$((patch + 1))"
          tag="v$next"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi

          perl -0pi -e "s/^VERSION=\\Q$version\\E$/VERSION=$next/m" wto

          git add wto
          git commit -m "chore(release): $tag"
          git tag -a "$tag" -m "wto $tag"

          git push origin HEAD:main
          git push origin "$tag"

          echo "released=true" >>"$GITHUB_OUTPUT"
          echo "version=$next" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "$TAG" \
            ./wto \
            --title "wto v$VERSION" \
            --notes "Release $TAG"
