name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell:
    name: Shell validation and Bats tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Validate shell syntax
        run: sh -n wto

      - name: Run ShellCheck
        run: shellcheck wto

      - name: Smoke test commands
        run: |
          WTO_COLOR=never ./wto --help
          WTO_COLOR=never ./wto version

      - name: Run Bats tests
        run: bats test
